<head>

<title>무안현경중학교 연구학교 교수·학습 과정안</title>

<style>
/* Layout: 한 화면 한 교과. 위쪽 고정 탭으로 교과를 바꾸고, 교과 안에서는 원본 과정안의 번호 순서대로 위에서 아래로 읽는다. */
:root{
  --bg:#f5f3f6; --surface:#ffffff; --fg:#221c25; --muted:#6b6270; --line:#ddd6e0;
  --accent:#7b3f6a; --accent-fg:#ffffff; --soft:#efe6f0; --ring:#e6d9e8;
  --mark:#fbf0bd; --mark-line:#e0cb74; --mark-fg:#4a3d00;
  --serif:"Noto Serif KR","Nanum Myeongjo",serif; --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17131a; --surface:#221c26; --fg:#efe9f1; --muted:#a99eb0; --line:#3a3140;
    --accent:#d9a6cc; --accent-fg:#1c1320; --soft:#33263a; --ring:#33263a;
    --mark:#4a4018; --mark-line:#7a6a2a; --mark-fg:#f5e9b0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17131a; --surface:#221c26; --fg:#efe9f1; --muted:#a99eb0; --line:#3a3140;
  --accent:#d9a6cc; --accent-fg:#1c1320; --soft:#33263a; --ring:#33263a;
  --mark:#4a4018; --mark-line:#7a6a2a; --mark-fg:#f5e9b0; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
header.top{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:16px;padding:22px 20px 20px}
header.top::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;
  background:repeating-radial-gradient(circle at center,transparent 0 12px,var(--ring) 12px 14px);pointer-events:none}
header.top>*{position:relative;z-index:1}
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.04em;margin:0}
h1{font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.3;margin:6px 0 4px;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:14px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);padding:12px 0 10px;
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
nav.tabs button{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 2px 7px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;line-height:1.25;min-width:0}
nav.tabs button b{font-size:16px;font-weight:700}
nav.tabs button span{font-size:11px;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
nav.tabs button[aria-selected="true"] span{color:inherit;opacity:.85}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lesson-head{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;margin-top:6px}
.lesson-head h2.subj{font-family:var(--serif);font-size:24px;margin:0 0 10px;line-height:1.3}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
.meta dt{color:var(--muted)}
.meta dd{margin:0;min-width:0}
.jump{margin-top:14px;font:inherit;font-size:14px;font-weight:500;color:var(--accent);background:var(--soft);border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
section.sec{margin-top:30px}
section.sec>h3{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:19px;line-height:1.35;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.no{flex:none;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--accent-fg);font-family:var(--sans);font-size:14px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
p.txt{margin:0;max-width:65ch}
.card p.txt+p.txt{margin-top:10px}
h4.sh{margin:6px 0 -2px;font-size:14px;font-weight:700;color:var(--accent)}
.kv{display:grid;grid-template-columns:1fr;gap:0;margin:0}
.kv>div{padding:10px 0;border-top:1px solid var(--line);min-width:0}
.kv>div:first-child{border-top:0;padding-top:0}
.kv>div:last-child{padding-bottom:0}
.kv dt{font-size:13px;font-weight:700;color:var(--accent);margin:0 0 2px}
.kv dd{margin:0}
ul.list{margin:0;padding:0;list-style:none}
ul.list li{position:relative;padding-left:16px}
ul.list li+li{margin-top:4px}
ul.list li::before{content:"";position:absolute;left:2px;top:.75em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.flow{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.row .no2{font-weight:700;color:var(--accent);font-size:15px;line-height:1.4}
.row .no2 small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.row h5{margin:0;font-size:15px;font-weight:700;line-height:1.5}
.row p{margin:2px 0 0;font-size:14px;color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.row.hi{background:var(--mark);border-color:var(--mark-line);color:var(--mark-fg)}
.row.hi .no2,.row.hi .no2 small,.row.hi p{color:var(--mark-fg)}
.row.hi .chip{background:transparent;border-color:var(--mark-line);color:var(--mark-fg)}
.tag{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-fg);border-radius:4px;padding:0 6px;vertical-align:1px}
.step{display:grid;gap:8px}
.step h5{margin:0;font-size:15px;font-weight:700;color:var(--accent)}
.timebar{display:flex;gap:3px;margin:4px 0 14px}
.timebar div{min-width:0;text-align:center;background:var(--soft);border-radius:8px;padding:6px 2px;font-size:12px;line-height:1.3;color:var(--fg)}
.timebar div b{display:block;font-size:13px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage+.stage{margin-top:12px}
.stage>h4{margin:0;padding:9px 16px;background:var(--accent);color:var(--accent-fg);font-size:15px;display:flex;justify-content:space-between;gap:8px}
.srow{padding:12px 16px;border-top:1px solid var(--line)}
.stage>h4+.srow{border-top:0}
.srow .lab{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.acts p{margin:0}
.a-b{position:relative;padding-left:14px;margin-top:4px!important}
.a-b::before{content:"•";position:absolute;left:2px;color:var(--accent)}
.a-h{font-weight:700;margin-top:10px!important}
.acts p:first-child{margin-top:0!important}
.a-s{position:relative;padding-left:30px;margin-top:3px!important;font-size:14px}
.a-s::before{content:"–";position:absolute;left:14px;color:var(--muted)}
.a-q{margin:6px 0 6px 14px!important;padding:8px 12px;border:1px dashed var(--accent);border-radius:8px;background:var(--soft);font-size:14px}
.mat{padding:12px 16px;border-top:1px solid var(--line);background:var(--bg)}
.mat .lab{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.mat .acts{font-size:14px}
.plan-info{margin-bottom:14px}
.blank{color:var(--muted)}
@media (min-width:560px){
  .kv.wide>div{display:grid;grid-template-columns:150px 1fr;gap:12px}
  .kv.wide dt{margin:0;padding-top:1px}
  h1{font-size:30px}
}
@media (prefers-reduced-motion:no-preference){ .panel{animation:fade .2s ease-out} }
@keyframes fade{from{opacity:.4}to{opacity:1}}
</style>

</head>

         {lab:"전개",a:["# 전 차시 복습 및 활동 상기","# AI 양파 탐정단 활동","- 교사가 제시한 AI로 만든 광고를 분석한다. (허위정보, 과장된 표현을 찾아 학습지에 적기)","- 허위정보, 과장된 표현을 직접 식약청과 정보검색등 공신력 있는 자료를 확인하여 표현을 고쳐본다.","- AI를 활용하여 모둠별로 직접 건강홍보물을 만들어본다.","> 프롬프트: “양파가 환경호르몬으로부터 우리 몸을 보호한다는 내용의 건강 홍보문을 만들어줘”","- AI로 직접 만든 건강홍보물에서 잘못된 정보나 과장된 정보를 찾아 올바른 표현법으로 AI를 활용하여 고치도록 한다.",
                   "# 모둠별 AI활용 제작 건강홍보물 공유","- 모둠별로 올바른 표현법으로 고쳐진 완성된 AI 건강정보 홍보물을 공유한다."]}],
        mat:["# ppt 활용","- ppt를 활용하여 학생들의 집중력을 높인다.","# AI활용 규칙","- 학생들이 이해할 수 있게 쉽게 사용법에 대해 설명한다."]},
       {name:"정리 및 평가",tag:"정리",min:5,rows:[
         {lab:"내용 정리 및 마무리",a:["# 학습지 정리","- 학습지를 정리하며 배운내용을 상기한다.","# 다음차시 안내 및 마무리 인사하기"]}],
        mat:["다음 차시 안내"]}
      ]}
   ]}
  ]
}
];

function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

function acts(list){
  var box=el("div","acts");
  list.forEach(function(s){
    var d;
    if(s.indexOf("# ")===0) d=el("p","a-h",s.slice(2));
    else if(s.indexOf("- ")===0) d=el("p","a-s",s.slice(2));
    else if(s.indexOf("> ")===0) d=el("p","a-q",s.slice(2));
    else d=el("p","a-b",s);
    box.appendChild(d);
  });
  return box;
}

function kv(items, wide){
  var dl=el("dl","kv"+(wide?" wide":""));
  items.forEach(function(p){
    var d=el("div"); d.appendChild(el("dt",null,p[0])); d.appendChild(el("dd",null,p[1])); dl.appendChild(d);
  });
  return dl;
}

function block(b){
  var k=b.k, out;
  if(k==="p"){
    out=el("div","card");
    b.v.forEach(function(t){ out.appendChild(el("p","txt",t)); });
  } else if(k==="h"){
    out=el("h4","sh",b.v);
  } else if(k==="ul"){
    out=el("div","card"); var ul=el("ul","list");
    b.v.forEach(function(t){ ul.appendChild(el("li",null,t)); }); out.appendChild(ul);
  } else if(k==="kv"){
    out=el("div","card"); out.appendChild(kv(b.v, b.wide));
  } else if(k==="cards"){
    out=el("div","stack");
    b.v.forEach(function(c){
      var card=el("div","card step"); card.appendChild(el("h5",null,c.name));
      var named=c.f.some(function(f){return f[0];});
      if(named) card.appendChild(kv(c.f)); else card.appendChild(el("p","txt",c.f[0][1]));
      out.appendChild(card);
    });
  } else if(k==="flow"){
    out=el("div","flow");
    b.v.forEach(function(r){
      var row=el("div","row"+(r.hi?" hi":""));
      var n=el("div","no2",r.no); n.appendChild(el("small",null,r.sub||"차시")); row.appendChild(n);
      var main=el("div"); var h=el("h5",null,r.title);
      if(r.hi) h.appendChild(el("span","tag","본시"));
      main.appendChild(h);
      if(r.text) main.appendChild(el("p",null,r.text));
      var chips=el("div","chips");
      if(r.mat) chips.appendChild(el("span","chip","자료 · "+r.mat));
      if(r.note) chips.appendChild(el("span","chip",r.note));
      if(chips.children.length) main.appendChild(chips);
      row.appendChild(main); out.appendChild(row);
    });
  } else if(k==="worksheet"){
    out=el("div","card"); out.appendChild(el("h4","sh",b.title));
    out.appendChild(el("p","txt blank",b.fields));
    out.appendChild(acts(b.v));
  } else if(k==="plan"){
    out=el("div","plan");
    var info=el("div","card plan-info"); info.appendChild(kv(b.info,true)); out.appendChild(info);
    var g=el("div","card plan-info"); g.appendChild(el("h4","sh",b.goalLabel||"학습목표"));
    var gl=el("ul","list"); b.goals.forEach(function(t){ gl.appendChild(el("li",null,t)); }); g.appendChild(gl);
    if(b.notes){ g.appendChild(el("h4","sh",b.notesLabel)); var nl=el("ul","list"); b.notes.forEach(function(t){ nl.appendChild(el("li",null,t)); }); g.appendChild(nl); }
    out.appendChild(g);
    var total=b.stages.reduce(function(s,x){return s+x.min;},0);
    var bar=el("div","timebar"); bar.setAttribute("role","img"); bar.setAttribute("aria-label","수업 시간 배분 "+total+"분");
    b.stages.forEach(function(s){ var d=el("div"); d.style.flex=String(s.min)+" 1 0"; d.appendChild(el("b",null,s.tag)); d.appendChild(document.createTextNode(s.min+"분")); bar.appendChild(d); });
    out.appendChild(bar);
    b.stages.forEach(function(s){
      var st=el("div","stage"); var h=el("h4"); h.appendChild(el("span",null,s.name)); h.appendChild(el("span",null,s.min+"분")); st.appendChild(h);
      s.rows.forEach(function(r){ var sr=el("div","srow"); sr.appendChild(el("div","lab",r.lab)); sr.appendChild(acts(r.a)); st.appendChild(sr); });
      if(s.mat){ var m=el("div","mat"); m.appendChild(el("div","lab","자료 및 유의점")); m.appendChild(acts(s.mat.map(function(t){ return (t.indexOf("# ")===0||t.indexOf("- ")===0)?t:t; }))); st.appendChild(m); }
      out.appendChild(st);
    });
  }
  return out;
}

var tabs=document.getElementById("tabs"), panels=document.getElementById("panels");
var tabEls={}, panelEls={};

LESSONS.forEach(function(L, i){
  var btn=el("button"); btn.type="button"; btn.id="tab-"+L.id; btn.setAttribute("role","tab"); btn.setAttribute("aria-controls","panel-"+L.id);
  btn.appendChild(el("b",null,L.subj)); btn.appendChild(el("span",null,L.period+" · "+L.grade));
  btn.addEventListener("click", function(){ show(L.id, true); });
  tabs.appendChild(btn); tabEls[L.id]=btn;

  var p=el("section","panel"); p.id="panel-"+L.id; p.setAttribute("role","tabpanel"); p.setAttribute("aria-labelledby","tab-"+L.id); p.hidden=true;
  var head=el("div","lesson-head"); head.appendChild(el("h2","subj",L.subj+"과 교수·학습 과정안"));
  var dl=el("dl","meta"); L.head.forEach(function(r){ dl.appendChild(el("dt",null,r[0])); dl.appendChild(el("dd",null,r[1])); }); head.appendChild(dl);
  var jump=el("button","jump","본시 과정안으로 이동 ↓"); jump.type="button";
  jump.addEventListener("click", function(){ var t=document.getElementById("plan-"+L.id); if(t) t.scrollIntoView({behavior:"smooth",block:"start"}); });
  head.appendChild(jump); p.appendChild(head);
  L.secs.forEach(function(s, n){
    var sec=el("section","sec"); if(s.id==="plan") sec.id="plan-"+L.id;
    var h=el("h3"); h.appendChild(el("span","no",String(n+1))); h.appendChild(el("span",null,s.t)); sec.appendChild(h);
    var st=el("div","stack"); s.b.forEach(function(b){ st.appendChild(block(b)); }); sec.appendChild(st);
    p.appendChild(sec);
  });
  panels.appendChild(p); panelEls[L.id]=p;
});

function show(id, update){
  if(!panelEls[id]) id="korean";
  LESSONS.forEach(function(L){
    var on=L.id===id; panelEls[L.id].hidden=!on;
    tabEls[L.id].setAttribute("aria-selected", on?"true":"false"); tabEls[L.id].tabIndex=on?0:-1;
  });
  if(update){ try{ history.replaceState(null,"","#"+id); }catch(e){ try{ location.hash=id; }catch(e2){} } window.scrollTo(0,0); }
}
tabs.addEventListener("keydown", function(e){
  var ids=LESSONS.map(function(L){return L.id;}); var cur=ids.filter(function(id){return tabEls[id].getAttribute("aria-selected")==="true";})[0];
  var i=ids.indexOf(cur); if(e.key==="ArrowRight") i=(i+1)%ids.length; else if(e.key==="ArrowLeft") i=(ids.length+i-1)%ids.length; else return;
  show(ids[i], true); tabEls[ids[i]].focus(); e.preventDefault();
});
var start="korean"; try{ start=(location.hash||"").replace("#","")||"korean"; }catch(e){}
show(start,false);
})();
</script>
